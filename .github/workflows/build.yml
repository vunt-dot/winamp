name: Build

on:
  push:
    branches: [community, 'claude/**']
  workflow_dispatch:

jobs:
  windows:
    name: Windows x86 Release
    runs-on: windows-2022
    outputs:
      exe_built: ${{ steps.summary.outputs.exe_built }}
    timeout-minutes: 360
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
      # Current vcpkg: older releases download tools (7-Zip, MSYS2 packages) from URLs
      # that no longer exist. vcpkg-ports/ overlays still pin the library versions.
      VCPKG_TAG: master
    steps:
      - uses: actions/checkout@v4

      - name: Locate Visual Studio
        id: vs
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * -property installationPath
          "path=$path" >> $env:GITHUB_OUTPUT
          Write-Host "Visual Studio: $path"

      # The projects target the VS2019 toolset (v142) and use ATL/MFC.
      - name: Install v142 toolset with ATL/MFC
        shell: pwsh
        run: |
          $vs = "${{ steps.vs.outputs.path }}"
          $components = @(
            'Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64',
            'Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL',
            'Microsoft.VisualStudio.Component.VC.14.29.16.11.MFC',
            'Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64.Spectre',
            'Microsoft.VisualStudio.Component.Windows10SDK.19041'
          )
          $installArgs = @('modify', '--installPath', "`"$vs`"", '--quiet', '--norestart', '--nocache')
          foreach ($c in $components) { $installArgs += @('--add', $c) }
          $have = (Test-Path "$vs\VC\Tools\MSVC\14.29.*\atlmfc\include\atlbase.h") -and
                  (Test-Path "$vs\VC\Tools\MSVC\14.29.*\lib\spectre\x86")
          if ($have) {
            Write-Host "v142 toolset with ATL and Spectre libraries already installed"
          } else {
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $p = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
            Write-Host "Visual Studio installer exit code: $($p.ExitCode)"
          }
          Get-ChildItem "$vs\VC\Tools\MSVC" | Select-Object Name
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.29.*\atlmfc\include\atlbase.h")) {
            Write-Host "::error::MSVC 14.29 (v142) with ATL is not installed"
            exit 1
          }
          if (-not (Test-Path "$vs\VC\Tools\MSVC\14.29.*\lib\spectre\x86")) {
            Write-Host "::error::MSVC 14.29 (v142) Spectre-mitigated libraries are not installed"
            exit 1
          }

      # README: "Microsoft ATLMFC lib fix" (atltransactionmanager.h does not compile otherwise).
      - name: Patch atltransactionmanager.h
        shell: pwsh
        run: |
          $vs = "${{ steps.vs.outputs.path }}"
          Get-ChildItem "$vs\VC\Tools\MSVC\*\atlmfc\include\atltransactionmanager.h" | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            $patched = $text.Replace('return ::DeleteFile((LPTSTR)lpFileName);', 'return DeleteFile((LPTSTR)lpFileName);')
            if ($patched -ne $text) { Set-Content -Path $_.FullName -Value $patched -NoNewline; Write-Host "patched $($_.FullName)" }
          }

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-x86-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg-ports/**') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-x86-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg-ports/**') }}-
            vcpkg-x86-${{ env.VCPKG_TAG }}-

      # Same steps as install-packages.cmd, without the interactive pauses.
      - name: Install vcpkg packages
        shell: cmd
        run: |
          if not exist "%VCPKG_DEFAULT_BINARY_CACHE%" mkdir "%VCPKG_DEFAULT_BINARY_CACHE%"
          git clone --depth 1 --branch %VCPKG_TAG% https://github.com/microsoft/vcpkg.git || exit /b 1
          call .\vcpkg\bootstrap-vcpkg.bat -disableMetrics || exit /b 1
          .\vcpkg\vcpkg.exe integrate install || exit /b 1
          xcopy /K /Y /H /C /I /E .\vcpkg-ports\* .\vcpkg\ports\* || exit /b 1
          rem Build the libraries with the same compiler as Winamp (v142). Objects from the
          rem VS2022 compiler need runtime helpers (__ultof3, __dtoul3_legacy, volatileaccessu)
          rem that the v142 linker/CRT does not have.
          for %%T in (x86-windows-static-md x86-windows-static) do (
            set TRIPLET_FILE=
            if exist .\vcpkg\triplets\%%T.cmake set TRIPLET_FILE=.\vcpkg\triplets\%%T.cmake
            if exist .\vcpkg\triplets\community\%%T.cmake set TRIPLET_FILE=.\vcpkg\triplets\community\%%T.cmake
            call :settoolset %%T
          )
          goto :install
          :settoolset
          if "%TRIPLET_FILE%"=="" (echo triplet %1 not found & exit /b 1)
          echo.>> "%TRIPLET_FILE%"
          echo set(VCPKG_PLATFORM_TOOLSET v142)>> "%TRIPLET_FILE%"
          echo patched %TRIPLET_FILE%
          exit /b 0
          :install
          cd .\vcpkg
          vcpkg install --recurse ^
            alac:x86-windows-static-md ^
            expat:x86-windows-static-md expat:x86-windows-static ^
            freetype[core,zlib,png,bzip2]:x86-windows-static-md ^
            ijg-libjpeg:x86-windows-static-md ^
            libflac:x86-windows-static-md ^
            libogg:x86-windows-static-md ^
            libpng:x86-windows-static-md ^
            libsndfile:x86-windows-static-md ^
            libtheora:x86-windows-static-md ^
            libvorbis:x86-windows-static-md ^
            libvpx:x86-windows-static-md ^
            minizip:x86-windows-static-md ^
            mp3lame:x86-windows-static-md ^
            mpg123:x86-windows-static-md ^
            openssl:x86-windows-static-md openssl:x86-windows-static ^
            pthread:x86-windows-static-md pthread:x86-windows-static ^
            restclient-cpp:x86-windows-static-md restclient-cpp:x86-windows-static ^
            spdlog:x86-windows-static-md ^
            zlib:x86-windows-static-md zlib:x86-windows-static

      # Save even when a later port fails, so the next run only rebuilds what is missing.
      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-x86-${{ env.VCPKG_TAG }}-${{ hashFiles('vcpkg-ports/**') }}-${{ github.run_id }}

      - name: Upload vcpkg failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

      - name: Unpack Qt runtime
        shell: cmd
        run: 7z x .\Qt\DLL_5.12_x86\Release.7z.001 -y -o.\Qt\DLL_5.12_x86

      - name: Build winampAll_2019.sln (Release|Win32)
        id: build
        continue-on-error: true
        shell: cmd
        run: |
          call "${{ steps.vs.outputs.path }}\VC\Auxiliary\Build\vcvars32.bat" -vcvars_ver=14.29 || exit /b 1
          msbuild winampAll_2019.sln /m /p:Configuration=Release /p:Platform=Win32 /nologo /v:minimal ^
            /flp1:errorsonly;logfile=msbuild-errors.log /flp2:warningsonly;logfile=msbuild-warnings.log

      - name: Summarize build errors
        id: summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path msbuild-errors.log) {
            # One line per distinct error, also printed to the log so it can be read without the artifact.
            $errors = Get-Content msbuild-errors.log | ForEach-Object { $_.Trim() } | Sort-Object -Unique
            Write-Host "===== $($errors.Count) distinct MSBuild errors ====="
            $errors | Select-Object -First 300 | ForEach-Object { Write-Host $_ }
            "### MSBuild errors: $($errors.Count)" >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            $errors | Select-Object -First 200 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
          $exe = Test-Path Build\Winamp_x86_Release\winamp.exe
          "exe_built=$($exe.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "winamp.exe built: $exe"
          if (Test-Path Build\Winamp_x86_Release) {
            $bins = Get-ChildItem -Recurse Build\Winamp_x86_Release -Include *.exe,*.dll,*.w5s,*.wac
            Write-Host "Built binaries: $($bins.Count)"
            $bins | ForEach-Object { Write-Host "  $($_.FullName.Substring((Resolve-Path Build\Winamp_x86_Release).Path.Length))" }
            "Built binaries: $($bins.Count), winamp.exe: $exe" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-logs
          path: msbuild-*.log
          if-no-files-found: ignore

      - name: Upload Winamp (Windows x86)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Winamp_x86_Release
          path: |
            Build/Winamp_x86_Release
            !Build/Winamp_x86_Release/**/*.pdb
          if-no-files-found: warn

      - name: Fail if the build failed
        if: steps.build.outcome != 'success'
        shell: pwsh
        run: |
          Write-Host "::error::msbuild failed - see the job summary and the msbuild-logs artifact"
          exit 1

  deb:
    name: Ubuntu .deb (Wine)
    needs: windows
    # Package whenever winamp.exe was produced, even if some optional plugins failed.
    if: ${{ !cancelled() && needs.windows.outputs.exe_built == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Winamp_x86_Release
          path: winamp-build

      - name: Build .deb
        run: |
          mkdir -p out
          packaging/linux/build-deb.sh winamp-build 5.9.2-1 out
          dpkg-deb -I out/*.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: winamp-deb
          path: out/*.deb
